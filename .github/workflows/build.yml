name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.3.14"
  RUST_VERSION: "1.94.0"
  NODE_VERSION: "22"

jobs:
  # ─── Lint & Typecheck ───
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck duoduo
        run: cd packages/duoduo && bun run typecheck

      - name: Typecheck app
        run: cd packages/app && bun run typecheck

      - name: Typecheck desktop
        run: cd packages/desktop && bun run typecheck

      - name: Verify schema snapshots are up-to-date
        run: |
          bun run export-schema
          if ! git diff --exit-code -- schema/; then
            echo "::error::Schema snapshots are out of date. Run 'bun run export-schema' and commit the changes."
            git diff -- schema/
            exit 1
          fi

  # ─── TS Unit Tests (duoduo) ───
  # Blocking gate (0.4): runs the offline-safe unit suite. Integration tests
  # that hit the network / external LLM / spawn child processes are gated with
  # `live.skipIf(process.env.CI)` in code. A failure here fails the pipeline.
  test:
    name: TS Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run duoduo unit tests
        working-directory: packages/duoduo
        run: bun run test:ci

      # 2026-09-18: the unit-test step once died mid-run with "exit code 143"
      # (SIGTERM) while every visible test had passed, and the always()/post
      # steps were skipped — the signature of a runner-level teardown, not a
      # test failure. This step leaves forensic evidence when it happens again:
      # OOM killer traces (SIGKILL/137) vs. nothing-but-runner-shutdown, plus
      # memory/disk headroom at the time of death.
      - name: Diagnose termination (OOM / runner teardown evidence)
        if: always()
        run: |
          echo "=== memory ==="
          free -h || true
          echo "=== disk ==="
          df -h / /tmp || true
          echo "=== kernel OOM / kill traces ==="
          sudo dmesg | grep -iE "oom|out of memory|killed process" | tail -20 || echo "(no OOM traces — if the step above died with 143 and these are empty, the runner itself was torn down)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-unit-junit
          path: packages/duoduo/.artifacts/unit/junit.xml
          if-no-files-found: ignore

  # ─── TS Unit Tests (app) ───
  # Blocking gate (0.4): happydom-based unit tests, no spawn / no network.
  test-app:
    name: TS Unit Tests (app)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run app unit tests
        working-directory: packages/app
        run: bun run test:ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-junit
          path: packages/app/.artifacts/unit/junit.xml
          if-no-files-found: ignore

  # ─── Rust Check ───
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # tauri build script 在 cargo check 阶段就会校验 externalBin/resources 存在性，
      # 但 sidecar 二进制与打包资源（LICENSE / ThirdPartyLicenses.txt，均由
      # predev/ensure-license-resources 生成）是后续 job 的产物，此处先占位。
      - name: Create placeholder sidecars & bundle resources
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          touch packages/desktop/src-tauri/sidecars/duoduocode-cli-x86_64-unknown-linux-gnu
          touch packages/desktop/src-tauri/sidecars/duo-smart-layer-x86_64-unknown-linux-gnu
          cp LICENSE packages/desktop/src-tauri/LICENSE
          touch packages/desktop/src-tauri/ThirdPartyLicenses.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  # ─── Build duo-smart-layer ───
  build-smart-layer:
    name: Build Smart Layer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [rust-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            # tree-sitter grammar 的 C++ scanner 需要 g++ 交叉编译器；
            # rustc 链接 aarch64 产物也需要显式指定交叉 linker
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build duo-smart-layer
        run: cargo build --release -p duo-smart-layer --target ${{ matrix.target }}

      - name: Copy sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          cp target/${{ matrix.target }}/release/duo-smart-layer \
             packages/desktop/src-tauri/sidecars/duo-smart-layer-${{ matrix.target }}
          chmod +x packages/desktop/src-tauri/sidecars/duo-smart-layer-${{ matrix.target }}

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          cp target/${{ matrix.target }}/release/duo-smart-layer.exe `
             packages/desktop/src-tauri/sidecars/duo-smart-layer-${{ matrix.target }}.exe

      - name: Upload smart layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: duo-smart-layer-${{ matrix.target }}
          path: |
            packages/desktop/src-tauri/sidecars/duo-smart-layer-*
          retention-days: 5

  # ─── Build duoduocode-cli ───
  build-duoduocode-cli:
    name: Build DuoDuoCode CLI (${{ matrix.ocBinary }})
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ocBinary 必须与 build.ts 的 dist 目录名一致：
          # duoduo-<os>-<arch>[-baseline]（os: win32 写作 windows）
          - ocBinary: duoduo-darwin-arm64
            bunTarget: bun-darwin-arm64
            rustTarget: aarch64-apple-darwin
            runner: macos-latest
          - ocBinary: duoduo-darwin-x64-baseline
            bunTarget: bun-darwin-x64-baseline
            rustTarget: x86_64-apple-darwin
            runner: macos-latest
          - ocBinary: duoduo-windows-arm64
            bunTarget: bun-windows-arm64
            rustTarget: aarch64-pc-windows-msvc
            runner: windows-latest
          - ocBinary: duoduo-windows-x64-baseline
            bunTarget: bun-windows-x64-baseline
            rustTarget: x86_64-pc-windows-msvc
            runner: windows-latest
          - ocBinary: duoduo-linux-x64-baseline
            bunTarget: bun-linux-x64-baseline
            rustTarget: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - ocBinary: duoduo-linux-arm64
            bunTarget: bun-linux-arm64
            rustTarget: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun compile 需要目标平台运行时；其内置下载器在 CI 上偶发
      # "download may be incomplete" 且重试无效。改为从 GitHub release
      # 显式预取（curl --retry）并按 bun 缓存布局落位，构建即免下载。
      - name: Pre-warm bun compile runtime
        shell: bash
        run: |
          set -e
          cache="$HOME/.bun/install/cache"
          mkdir -p "$cache"
          # bunTarget 形如 bun-darwin-arm64 / bun-windows-x64-baseline；
          # release 资产与 bun 缓存命名用 aarch64，先归一化
          norm=$(echo "${{ matrix.bunTarget }}" | sed 's/arm64/aarch64/')
          entry="$cache/$norm-v${{ env.BUN_VERSION }}"
          if [ -f "$entry" ]; then echo "runtime already cached: $entry"; exit 0; fi
          case "$norm" in
            bun-darwin-aarch64*)  zip="bun-darwin-aarch64.zip" ;;
            bun-darwin-x64*)      zip="bun-darwin-x64-baseline.zip" ;;
            bun-windows-aarch64*) zip="bun-windows-aarch64.zip" ;;
            bun-windows-x64*)     zip="bun-windows-x64-baseline.zip" ;;
            bun-linux-aarch64*)   zip="bun-linux-aarch64.zip" ;;
            bun-linux-x64*)       zip="bun-linux-x64-baseline.zip" ;;
            *) echo "unknown target: $norm"; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/runtime.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${{ env.BUN_VERSION }}/$zip"
          rm -rf /tmp/bun-runtime && mkdir -p /tmp/bun-runtime
          if command -v unzip >/dev/null 2>&1; then
            unzip -q /tmp/runtime.zip -d /tmp/bun-runtime
          else
            tar -xf /tmp/runtime.zip -C /tmp/bun-runtime
          fi
          bin=$(find /tmp/bun-runtime -type f \( -name bun -o -name bun.exe \) | head -1)
          cp "$bin" "$entry"
          echo "pre-warmed $entry ($zip)"

      # 保险重试：预取失败或其它瞬时问题时最多再试 3 次
      - name: Build duoduocode-cli
        working-directory: packages/duoduo
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== build attempt ${attempt} ==="
            if bun run script/build.ts --target ${{ matrix.bunTarget }}; then
              exit 0
            fi
            echo "attempt ${attempt} failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Rename and stage sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          cp packages/duoduo/dist/${{ matrix.ocBinary }}/bin/duoduocode \
             packages/desktop/src-tauri/sidecars/duoduocode-cli-${{ matrix.rustTarget }}
          chmod +x packages/desktop/src-tauri/sidecars/duoduocode-cli-${{ matrix.rustTarget }}

      - name: Rename and stage sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          cp packages/duoduo/dist/${{ matrix.ocBinary }}/bin/duoduocode.exe `
             packages/desktop/src-tauri/sidecars/duoduocode-cli-${{ matrix.rustTarget }}.exe

      - name: Upload duoduocode-cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoduocode-cli-${{ matrix.rustTarget }}
          path: |
            packages/desktop/src-tauri/sidecars/duoduocode-cli-*
          retention-days: 5

  # ─── Build Tauri App ───
  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [lint, build-smart-layer, build-duoduocode-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
          - target: x86_64-apple-darwin
            runner: macos-13
            args: "--target x86_64-apple-darwin"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            args: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Download smart layer artifact
        uses: actions/download-artifact@v4
        with:
          name: duo-smart-layer-${{ matrix.target }}
          path: packages/desktop/src-tauri/sidecars/

      - name: Download duoduocode-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: duoduocode-cli-${{ matrix.target }}
          path: packages/desktop/src-tauri/sidecars/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x packages/desktop/src-tauri/sidecars/duo-smart-layer-* packages/desktop/src-tauri/sidecars/duoduocode-cli-*

      - name: List sidecars
        shell: bash
        run: ls -la packages/desktop/src-tauri/sidecars/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.target }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/*
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/*
          retention-days: 5

  # ─── Release ───
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List release artifacts
        run: find artifacts/ -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
