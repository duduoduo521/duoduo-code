# E2E (browser layer) — runs the existing packages/app Playwright suite on
# Windows, macOS and Linux runners.
#
# Runtime split (P0-verified 2026-09-15):
#   - Playwright test runner MUST run under Node. Under the Bun runtime its CDP
#     transport times out (chromium.launch / connectOverCDP both fail) — this is
#     why the suite never ran before.
#   - Bun stays for dependency install and the webServer wrapper (mock LLM +
#     isolated backend + Vite), which are plain TS and Bun-safe.
#
# Trigger: flipped to push/PR (0.4) once the suite went green — every push to
# agent-develop runs ubuntu (fast feedback); PRs and manual runs cover all
# three platforms. Code/doc-only changes skip the suite via paths-filter.
name: E2E

on:
  push:
    branches: [agent-develop]
    paths:
      - "crates/**"
      - "packages/**"
      - ".github/workflows/e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [agent-develop]
    paths:
      - "crates/**"
      - "packages/**"
      - ".github/workflows/e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: E2E browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # push → ubuntu only (fast feedback); PR / manual → all three platforms.
    # NOTE: this cannot be a job-level `if:` — `matrix` context is unavailable
    # there ("Unrecognized named-value"), so the platform filter lives in the
    # matrix expression below.
    # 251 用例 × 重试 + 首次 Rust 侧车编译（冷缓存 10~20min，rust-cache 二次起效），
    # 2 vCPU runner 上全跑约 2 小时量级，60min 必爆。
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # reqwest (native-tls) needs OpenSSL headers on Linux — same as p4-fs.yml.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the Rust smart-layer sidecar so prompt/run-loop e2e specs can
      # run against the real agent backend (they skip when the binary is
      # absent — never fake-red). Debug profile: faster to compile, runtime
      # perf is irrelevant for these tests.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build smart-layer sidecar
        run: cargo build -p duo-smart-layer

      - name: Install Playwright chromium
        working-directory: packages/app
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npx --no-install playwright install --with-deps chromium
          else
            npx --no-install playwright install chromium
          fi

      - name: Run E2E suite
        working-directory: packages/app
        run: npx --no-install playwright test

      - name: Upload Playwright report & failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/app/e2e/playwright-report
            packages/app/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
