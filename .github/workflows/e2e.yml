# E2E (browser layer) — runs the existing packages/app Playwright suite on
# Windows and macOS runners.
#
# Runtime split (P0-verified 2026-09-15):
#   - Playwright test runner MUST run under Node. Under the Bun runtime its CDP
#     transport times out (chromium.launch / connectOverCDP both fail) — this is
#     why the suite never ran before.
#   - Bun stays for dependency install and the webServer wrapper (mock LLM +
#     isolated backend + Vite), which are plain TS and Bun-safe.
#
# Trigger: manual (workflow_dispatch) first; flip to push/PR paths once green.
name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: E2E browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Install Playwright chromium
        working-directory: packages/app
        run: npx --no-install playwright install chromium

      - name: Run E2E suite
        working-directory: packages/app
        run: npx --no-install playwright test

      - name: Upload Playwright report & failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/app/e2e/playwright-report
            packages/app/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
